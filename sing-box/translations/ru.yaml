configuration:
  config_url:
    name: Конфиг
    description: Ссылка на конфигурацию
  config_username:
    name: Логин
    description: Логин для HTTP Basic Auth (необязательно)
  config_password:
    name: Пароль
    description: Пароль для HTTP Basic Auth (необязательно)
  healthcheck_url:
    name: URL замера задержки
    description: HTTPS-адрес для замера задержки через каждый выход. Предпочтителен быстрый ответ без содержимого (HTTP 204).
  internet_check_urls:
    name: URL проверки прямого Интернета
    description: Проверяются вне WireGuard перед восстановлением туннеля. Достаточно ответа от одного адреса; укажите хотя бы один HTTP или HTTPS URL.
  healthcheck_tolerance:
    name: Порог переключения (мс)
    description: Насколько другой выход должен быть быстрее текущего. Отказ текущего выхода обрабатывается независимо от порога.
  healthcheck_interval:
    name: INTERVAL — интервал проверок (с)
    description: Период проверки выходов и туннеля, от 5 до 3600 секунд. Длительные циклы не перекрываются; heartbeat обновляется независимо от интервала.
  recovery_grace:
    name: Пауза на восстановление WireGuard (с)
    description: Время на восстановление WireGuard после запуска или смены выхода, от 0 до 3600 секунд. Затем нужны три подтверждённых отказа туннеля.
